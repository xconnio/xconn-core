[package]
name = "xconn-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Async and blocking WAMP clients, routers, and transports"
readme = "README.md"

[features]
services = ["async"]
crypto = ["dep:xconn-crypto"]
default = ["async", "sync"]
sync = ["mio", "async"]
async = ["tokio", "tokio-tungstenite", "futures-util", "async-trait"]

quic = ["async", "dep:quinn", "dep:rcgen"]
webtransport = ["async", "dep:webtrans-quion", "dep:rcgen"]

router = ["async", "dep:clap", "dep:serde", "dep:serde_yaml_ng", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:tracing", "dep:tracing-subscriber"]

[dependencies]
xconn-crypto = { version = "0.1.0", path = "../xconn-crypto", optional = true }
# base dependencies
wampproto = { version = "0.1.0", path = "../wampproto" }
tungstenite = {  version = "0.27.0", features = ["rustls-tls-native-roots"] }
url = { version = "2.5.4" }

# sync websocket
mio = { version = "1.0.4", optional = true }

# async websocket
tokio = { version = "1", features = ["full"], optional = true }
tokio-tungstenite = { version = "0.27.0", features = ["rustls-tls-native-roots"], optional = true }
futures-util = { version = "0.3.31", optional = true }
async-trait = { version = "0.1.88", optional = true }

quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", optional = true }
webtrans-quion = { version = "0.6", optional = true }

clap = { version = "4.6", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
rustls-pemfile = { version = "2", optional = true }

tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[[example]]
name = "sync_example"
path = "examples/sync/main.rs"
required-features = ["sync"]

[[example]]
name = "async_example"
path = "examples/async/main.rs"
required-features = ["async"]

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
rcgen = "0.13"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "xconn-router"
path = "src/bin/xconn-router/main.rs"
required-features = ["router"]

[[example]]
name = "streaming_peer"
path = "tests/support/streaming_peer.rs"
required-features = ["async"]

[[example]]
name = "discovery"
required-features = ["services"]

[[example]]
name = "backend"
required-features = ["services"]
test = true
