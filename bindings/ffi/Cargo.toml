[package]
name = "xconn-ffi"
version = "0.1.5"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
[lib]
crate-type = ["cdylib", "staticlib"]
[features]
default = ["webrtc", "quic", "webtransport"]
quic = ["xconn-binding-runtime/quic"]
webtransport = ["xconn-binding-runtime/webtransport"]
webrtc = ["xconn-binding-runtime/webrtc"]

[dependencies]
xconn-binding-runtime = { path = "../runtime" }
